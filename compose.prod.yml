name: gfat-worker

x-worker-image: &worker-image
  build:
    context: ./worker
  image: ${GFAT_WORKER_IMAGE:-gfat-worker:local}

x-worker-env: &worker-env
  BROKER_URL: redis://redis:6379/0
  RAW_DIR: /mnt/RAW/UGR
  PRODUCTS_DIR: /mnt/PRODUCTS/UGR
  INFO_SCC_CONFIG_PATH: /run/secrets/info_scc_user.yml
  CELERY_LOG_LEVEL: ${CELERY_LOG_LEVEL:-info}
  PYTHONUNBUFFERED: "1"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    <<: *worker-image
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *worker-env
    command: python -m uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    volumes:
      - ${RAW_HOST_DIR:?Set RAW_HOST_DIR in .env.production}:/mnt/RAW/UGR:ro
      - ${PRODUCTS_HOST_DIR:?Set PRODUCTS_HOST_DIR in .env.production}:/mnt/PRODUCTS/UGR
      - ${INFO_SCC_CONFIG_HOST_PATH:?Set INFO_SCC_CONFIG_HOST_PATH in .env.production}:/run/secrets/info_scc_user.yml:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    <<: *worker-image
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *worker-env
      CELERY_BEAT_ENABLED: "${CELERY_BEAT_ENABLED:-true}"
    command: sh -lc 'if [ "$${CELERY_BEAT_ENABLED}" = "true" ]; then python -m celery -A app worker -B -l "$${CELERY_LOG_LEVEL}"; else python -m celery -A app worker -l "$${CELERY_LOG_LEVEL}"; fi'
    volumes:
      - ${RAW_HOST_DIR:?Set RAW_HOST_DIR in .env.production}:/mnt/RAW/UGR:ro
      - ${PRODUCTS_HOST_DIR:?Set PRODUCTS_HOST_DIR in .env.production}:/mnt/PRODUCTS/UGR
      - ${INFO_SCC_CONFIG_HOST_PATH:?Set INFO_SCC_CONFIG_HOST_PATH in .env.production}:/run/secrets/info_scc_user.yml:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -m celery -A app inspect ping -d celery@$$HOSTNAME --timeout=10 | grep -q OK",
        ]
      interval: 60s
      timeout: 20s
      retries: 3

  flower:
    image: mher/flower
    restart: unless-stopped
    profiles:
      - ops
    depends_on:
      redis:
        condition: service_healthy
    command: celery --broker=redis://redis:6379/0 flower
    ports:
      - "${FLOWER_BIND:-127.0.0.1}:${FLOWER_PORT:-5555}:5555"

volumes:
  redis-data:
